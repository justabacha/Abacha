<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // 1. GHOST CHECK (Starts immediately for that "How did that happen?" speed)
    const SUPABASE_URL = 'https://zvkretqhqmxuhgspddpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.isDatabaseReady = false;
    window.finalTarget = null;

    (async function() {
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_approved')
                    .eq('id', session.user.id)
                    .single();

                if (profile && profile.is_approved) {
                    window.finalTarget = 'hub.html';
                } else {
                    await supabaseClient.auth.signOut();
                }
            }
        } catch (e) { console.error(e); }
        window.isDatabaseReady = true;
    })();
  </script>

  <style>
    /* YOUR ORIGINAL STYLES (Keep exactly as they were) */
    .ghost-row { display: flex; gap: 10px; font-size: 2rem; margin-top: 20px; height: 40px; }
    .ghost-emoji { opacity: 0; transform: translateY(10px); animation: ghostTap 0.3s forwards ease-out; }
    @keyframes ghostTap { to { opacity: 1; transform: translateY(0); } }

    .loader-container { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; margin-top: 20px; overflow: hidden; }
    #loader-fill { width: 0%; height: 100%; background: #32D74B; box-shadow: 0 0 10px #32D74B; transition: width 0.1s linear; }
    
    /* Ensure container is hidden for the fade-in effect */
    #login-container { opacity: 0; transition: opacity 1s ease; display: none; }
  </style>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
    <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 0;">Just•Abacha😎</h1>
    
    <div class="ghost-row" id="ghost-row">
        </div>

    <div class="loader-container">
      <div id="loader-fill"></div>
    </div>
  </div>

  <div id="login-container">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white;">|Just•Abacha😎|</div>
    
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div style="margin-top:20px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <script>
    const ghostRow = document.getElementById('ghost-row');
    const loaderFill = document.getElementById('loader-fill');
    
    // 1. GHOST TAP-TAP (Every 900ms)
    let ghostCount = 0;
    const maxGhosts = 7; 
    const ghostInterval = setInterval(() => {
        if (ghostCount < maxGhosts) {
            const span = document.createElement('span');
            span.className = 'ghost-emoji';
            span.innerText = '👻';
            ghostRow.appendChild(span);
            ghostCount++;
        }
    }, 900);

    // 2. LOADING BAR PROGRESS (7 Seconds)
    let progress = 0;
    const totalTime = 7000; 
    const progressInterval = setInterval(() => {
        progress += (100 / (totalTime / 100)); 
        if (progress >= 100) {
            loaderFill.style.width = '100%';
            clearInterval(progressInterval);
            
            // 🚨 THE SYNC: Only proceed when BOTH are done
            const checkDone = setInterval(() => {
                if (window.isDatabaseReady) {
                    clearInterval(checkDone);
                    proceed();
                }
            }, 100);
            
        } else {
            loaderFill.style.width = progress + '%';
        }
    }, 100);

    function proceed() {
        if (window.finalTarget) {
            window.location.replace(window.finalTarget);
        } else {
            showLoginUI();
        }
    }

    function showLoginUI() {
        clearInterval(ghostInterval);
        const splash = document.getElementById('splash-screen');
        const container = document.getElementById('login-container');
        if (splash) splash.style.opacity = '0';
        
        setTimeout(() => {
            if (splash) splash.remove();
            if (container) {
                container.style.display = 'block';
                setTimeout(() => { container.style.opacity = '1'; }, 50);
            }
        }, 1000);
    }
  </script>
</body>
</html>
