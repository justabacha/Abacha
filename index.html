  <script>
    // Global Config (using var to allow app.js to re-access/re-declare safely)
    var SUPABASE_URL = 'https://zvkretqhqmxuhgspddpu.supabase.co';
    var SUPABASE_KEY = 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY';
    
    window.isDatabaseReady = false;
    window.finalTarget = null;

    async function checkExistingSession() {
        try {
            const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                const { data: profile } = await client.from('profiles').select('is_approved').eq('id', session.user.id).single();
                if (profile && profile.is_approved) {
                    window.finalTarget = 'hub.html';
                } else {
                    await client.auth.signOut();
                }
            }
        } catch (e) { 
            console.error("Session Check Error:", e); 
        } finally {
            window.isDatabaseReady = true;
        }
    }
    checkExistingSession();
  </script>
