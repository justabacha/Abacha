<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Hub</title>
  <link rel="preconnect" href="https://api.open-meteo.com">
  <link rel="preconnect" href="https://geocoding-api.open-meteo.com">
  <!-- PWA / Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  <script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js"></script>
  <!-- Ghost visuals -->
  <script src="theme-engine.js"></script>

  <style>
    html, body {
      background: #000;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body class="hub-page">
<button id="ghost-install-fixed" onclick="executeGhostInstall()">📲 Install App</button>
  <!-- 🔒 SPLASH SCREEN -->
  <!-- 🌦 WEATHER / TIME -->
  <div class="glass-card" id="weather-widget">
    <h1 id="time">00:00</h1>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <p id="temp">--°C</p>
      <p id="condition">Loading weather...</p>
    </div>
    <hr style="border:0.5px solid var(--glass-border); margin:15px 0;">
    <p id="daily-quote" style="font-style:italic; opacity:0.8;">
      "Loading inspiration..."
    </p>
  </div>

  <!-- 🧭 NAVIGATION -->
  <div class="glass-card" style="margin:10px; padding:20px; border-radius:35px;">
    <p style="opacity:.6; font-size:12px; margin-bottom:15px; letter-spacing:1px;">
      GHOST NAVIGATION
    </p>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
      <a href="chat-list.html" class="nav-tile">💬<p>Chat</p></a>
      <a href="gallery.html" class="nav-tile">🎭<p>Gallery</p></a>
      <a href="bucket.html" class="nav-tile">📝<p>Bucket</p></a>
      <a href="settings.html" class="nav-tile">⚙️<p>Settings</p></a>
    </div>
  </div>

  <!-- 👣 FOOTER -->
  <div style="text-align:center; margin:80px 0 30px; padding:0 20px;">
    <p style="font-size:14px; font-weight:800; letter-spacing:1.5px;">
      ...Just•Abacha v1.0😎...
    </p>
    <p style="font-size:11px; line-height:1.6;">
      Handcrafted by Phestone. Powered by the Phesty Ghost Engine.<br>
      <span style="font-size:10px; font-weight:bold;">©2026 ALL RIGHTS RESERVED</span>
    </p>
  </div>

  <!-- 🔐 AUTH GUARD + SPLASH CONTROL -->
  <script>
    // We use a small interval to wait until app.js defines the client
    const checkAuth = async () => {
      if (typeof supabaseClient === 'undefined') {
        setTimeout(checkAuth, 50); // Wait 50ms and try again
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.replace('index.html');
        return;
      }

      const splash = document.getElementById('splash-screen');
      if (splash) {
        setTimeout(() => {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 600);
        }, 1200);
      }
    };

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
  <!-- 🧠 MAIN APP LOGIC -->
    <!-- 🔑 SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="notifications.js"></script>
  <script src="app.js"></script>
  <script src="hub.js"></script>

</body>
</html>
