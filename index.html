<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
    <h1 style="font-size: 3rem; font-weight: 900;">Just•Abacha😎</h1>
    <div style="font-size: 1.5rem; margin-top: 20px;">
      <span>👻</span> <span id="ghost-counter">0</span>
    </div>
  </div>

  <div id="login-container" style="opacity:0; transition: opacity 1s ease;">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white;">|Just•Abacha😎|</div>
    
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div style="margin-top:20px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <script>
    // 1. YOUR EXACT GHOST COUNTER
    let count = 0;
    const counterEl = document.getElementById('ghost-counter');
    const ghostInterval = setInterval(() => {
        count = (count % 5) + 1;
        if(counterEl) counterEl.innerText = count;
    }, 800);

    // 2. YOUR EXACT NESTED TIMEOUT STRUCTURE
    setTimeout(async () => {
        // Re-initializing the client inside the script to ensure it's ready
        const supabaseClient = window.supabase.createClient('https://zvkretqhqmxuhgspddpu.supabase.co', 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY');

        setTimeout(async () => {
            // Check session
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                // Check approval
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_approved')
                    .eq('id', session.user.id)
                    .single();

                if (profile && profile.is_approved) {
                    window.location.replace('hub.html');
                } else {
                    // Not approved? Sign out and show login
                    await supabaseClient.auth.signOut();
                    showLoginUI();
                }
            } else {
                showLoginUI();
            }
        }, 5000); // YOUR 5 SECONDS

        function showLoginUI() {
            clearInterval(ghostInterval);
            const splash = document.getElementById('splash-screen');
            if (splash) splash.style.opacity = '0';
            setTimeout(() => {
                if (splash) splash.remove();
                const container = document.getElementById('login-container');
                if (container) container.style.opacity = '1';
            }, 1000);
        }
    }, 2000); // YOUR 2 SECONDS
  </script>
</body>
</html>
