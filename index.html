<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 1. SMOOTH GHOST FADE-IN */
    .ghost-row {
      display: flex;
      gap: 12px;
      font-size: 2.2rem;
      margin-top: 25px;
      height: 50px;
    }
    .ghost-emoji {
      opacity: 0;
      filter: blur(5px);
      transform: scale(0.8);
      animation: ghostFadeIn 0.6s forwards ease-out;
    }
    @keyframes ghostFadeIn {
      to { 
        opacity: 1; 
        filter: blur(0);
        transform: scale(1);
      }
    }

    /* 2. PRECISION LOADING BAR */
    .loader-container {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      margin-top: 30px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    #loader-fill {
      width: 0%;
      height: 100%;
      background: #32D74B; 
      box-shadow: 0 0 15px rgba(50, 215, 75, 0.6);
      transition: width 0.1s linear; /* Keeps the movement fluid */
    }
  </style>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif; transition: opacity 1s ease;">
    <h1 style="font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0;">Just•Abacha😎</h1>
    
    <div class="ghost-row" id="ghost-row"></div>

    <div class="loader-container">
      <div id="loader-fill"></div>
    </div>
  </div>

  <div id="login-container" style="opacity:0; transition: opacity 1.2s ease;">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white; opacity:0.5;">|Just•Abacha😎|</div>
    
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" style="display:block; margin: 10px auto; padding:15px; width:250px; border-radius:12px; border:none; background:rgba(255,255,255,0.1); color:white;" />
      <input id="password" type="password" placeholder="Password" style="display:block; margin: 10px auto; padding:15px; width:250px; border-radius:12px; border:none; background:rgba(255,255,255,0.1); color:white;" />
      <div style="margin-top:25px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <script>
    const ghostRow = document.getElementById('ghost-row');
    const loaderFill = document.getElementById('loader-fill');
    
    // 1. ANIMATION STATE
    let ghostCount = 0;
    const maxGhosts = 5; 
    const totalTime = 7000; // Your 2s + 5s flow
    
    // 2. GHOST TAP-TAP (Fades in over time)
    const ghostInterval = setInterval(() => {
        if (ghostCount < maxGhosts) {
            const span = document.createElement('span');
            span.className = 'ghost-emoji';
            span.innerText = '👻';
            ghostRow.appendChild(span);
            ghostCount++;
        }
    }, 1200);

    // 3. SMOOTH LOADER (Fills precisely to 100% at 7 seconds)
    let startTime = Date.now();
    const updateLoader = () => {
        let elapsed = Date.now() - startTime;
        let percentage = Math.min((elapsed / totalTime) * 100, 100);
        loaderFill.style.width = percentage + '%';

        if (percentage < 100) {
            requestAnimationFrame(updateLoader);
        }
    };
    requestAnimationFrame(updateLoader);

    // 4. THE NESTED PROTOCOL (RESTORED)
    setTimeout(async () => {
        const supabaseClient = window.supabase.createClient('https://zvkretqhqmxuhgspddpu.supabase.co', 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY');

        setTimeout(async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            // Wait for loader to finish visually (adds a tiny 200ms buffer for vibe)
            setTimeout(async () => {
                if (session) {
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('is_approved')
                        .eq('id', session.user.id)
                        .single();

                    if (profile && profile.is_approved) {
                        window.location.replace('hub.html');
                    } else {
                        await supabaseClient.auth.signOut();
                        showLoginUI();
                    }
                } else {
                    showLoginUI();
                }
            }, 300); 
        }, 5000); 

        function showLoginUI() {
            clearInterval(ghostInterval);
            const splash = document.getElementById('splash-screen');
            if (splash) splash.style.opacity = '0';
            
            setTimeout(() => {
                if (splash) splash.remove();
                const container = document.getElementById('login-container');
                if (container) {
                    container.style.opacity = '1';
                }
            }, 1000);
        }
    }, 2000); 
  </script>
</body>
</html>
