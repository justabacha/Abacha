<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // SPEED CHECK: Redirect logged-in users before the page even loads
    const SUPABASE_URL = 'https://zvkretqhqmxuhgspddpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    (async function() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('is_approved, username')
                .eq('id', session.user.id)
                .single();

            if (profile && profile.is_approved) {
                if (!profile.username) {
                    window.location.replace('profile.html');
                } else {
                    window.location.replace('hub.html');
                }
            }
        }
    })();
  </script>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif; transition: opacity 0.8s ease;">
    <h1 style="font-size: 3rem; font-weight: 900;">Just•Abacha😎</h1>
    <div style="font-size: 1.5rem; margin-top: 20px;">
      <span>👻</span> <span id="ghost-counter">0</span>
    </div>
  </div>

  <div id="login-container" style="opacity:0; transition: opacity 1s ease; display:none;">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white;">|Just•Abacha😎|</div>
    
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div style="margin-top:20px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
  
  <script>
    let count = 0;
    const counterEl = document.getElementById('ghost-counter');
    const ghostInterval = setInterval(() => {
        count = (count % 5) + 1;
        if(counterEl) counterEl.innerText = count;
    }, 800);

    // REVEAL LOGIC
    setTimeout(() => {
        showLoginUI();
    }, 1500); 

    function showLoginUI() {
        clearInterval(ghostInterval);
        const splash = document.getElementById('splash-screen');
        const loginBox = document.getElementById('login-container');
        
        if (splash) splash.style.opacity = '0';
        
        setTimeout(() => {
            if (splash) splash.remove();
            if (loginBox) {
                loginBox.style.display = 'block'; // 🚨 RE-ACTIVATED
                // Small delay to trigger the opacity transition smoothly
                setTimeout(() => { loginBox.style.opacity = '1'; }, 50);
            }
        }, 800);
    }
  </script>
</body>
</html>
