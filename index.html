<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* 1. GHOST DSTV RHYTHM (Chasing Dots) */
    .ghost-row { display: flex; gap: 10px; font-size: 2rem; margin-top: 20px; height: 40px; }
    .ghost-emoji { opacity: 0.2; transition: all 0.3s ease; }
    /* The Anchor Ghost */
    .ghost-emoji:first-child { opacity: 1; filter: drop-shadow(0 0 5px #32D74B); }
    /* The Chase Pulse */
    .ghost-emoji.active { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 10px white); }

    /* 2. COLOR SHIFTING BAR (Red -> Blue -> Green) */
    .loader-container { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; margin-top: 20px; overflow: hidden; }
    #loader-fill { 
      width: 0%; height: 100%; 
      background: red; 
      box-shadow: 0 0 10px red;
      transition: width 0.1s linear, background 0.5s ease; 
    }

    /* 3. YOUR ORIGINAL LOGIN OPACITY LOGIC */
    #login-container { 
      opacity: 0; 
      transition: opacity 1s ease;
      /* No 'display: none' or 'height: 0' so app.js can see the buttons immediately */
    }
  </style>

  <script>
    // GHOST SESSION CHECK
    const SUPABASE_URL = 'https://zvkretqhqmxuhgspddpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.isDatabaseReady = false;
    window.finalTarget = null;

    (async function() {
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await supabaseClient.from('profiles').select('is_approved').eq('id', session.user.id).single();
                if (profile && profile.is_approved) window.finalTarget = 'hub.html';
                else await supabaseClient.auth.signOut();
            }
        } catch (e) { console.error(e); }
        window.isDatabaseReady = true;
    })();
  </script>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
    <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 0;">Just•Abacha😎</h1>
    <div class="ghost-row" id="ghost-row">
        <span class="ghost-emoji">👻</span> <span class="ghost-emoji">👻</span>
        <span class="ghost-emoji">👻</span>
        <span class="ghost-emoji">👻</span>
        <span class="ghost-emoji">👻</span>
    </div>
    <div class="loader-container"><div id="loader-fill"></div></div>
  </div>

  <div id="login-container">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white;">|Just•Abacha😎|</div>
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div style="margin-top:20px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <script>
    const ghosts = document.querySelectorAll('.ghost-emoji');
    const loaderFill = document.getElementById('loader-fill');
    let ghostIndex = 1;

    // DSTV LOOP
    setInterval(() => {
        for(let i=1; i<ghosts.length; i++) ghosts[i].classList.remove('active');
        ghosts[ghostIndex].classList.add('active');
        ghostIndex = (ghostIndex % (ghosts.length - 1)) + 1;
    }, 400);

    // BAR PROGRESS & COLOR BLEND
    let progress = 0;
    const progressInterval = setInterval(() => {
        progress += (100 / (7000 / 100)); 
        loaderFill.style.width = Math.min(progress, 100) + '%';

        if (progress < 40) {
            loaderFill.style.background = 'red';
            loaderFill.style.boxShadow = '0 0 10px red';
        } else if (progress < 75) {
            loaderFill.style.background = 'blue';
            loaderFill.style.boxShadow = '0 0 10px blue';
        } else {
            loaderFill.style.background = '#32D74B';
            loaderFill.style.boxShadow = '0 0 10px #32D74B';
        }

        if (progress >= 100) {
            clearInterval(progressInterval);
            const checkSync = setInterval(() => {
                if (window.isDatabaseReady) {
                    clearInterval(checkSync);
                    if (window.finalTarget) window.location.replace(window.finalTarget);
                    else {
                        // FADE OUT SPLASH, FADE IN LOGIN
                        document.getElementById('splash-screen').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('splash-screen').remove();
                            document.getElementById('login-container').style.opacity = '1';
                        }, 1000);
                    }
                }
            }, 100);
        }
    }, 100);
  </script>
</body>
</html>
