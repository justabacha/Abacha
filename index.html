<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 1. YOUR ORIGINAL GHOST STYLES (Enlarged) */
    .ghost-row { display: flex; gap: 10px; font-size: 3rem; margin-top: 20px; height: 60px; justify-content: center; }
    .ghost-emoji { 
      opacity: 0; 
      transform: translateY(10px); 
      animation: ghostTap 0.3s forwards ease-out; 
      display: inline-block;
    }
    @keyframes ghostTap { to { opacity: 1; transform: translateY(0); } }

    /* 2. YOUR ORIGINAL LOADING BAR (Thickened) */
    .loader-container { width: 250px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; margin-top: 20px; overflow: hidden; }
    #loader-fill { width: 0%; height: 100%; background: #32D74B; box-shadow: 0 0 10px #32D74B; transition: width 0.1s linear; }

    /* Ensure Login Container is actually ready for app.js */
    #login-container { display: none; opacity: 0; transition: opacity 1s ease; }
  </style>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
    <h1 style="font-size: 3.5rem; font-weight: 900; margin-bottom: 0;">Just•Abacha😎</h1>
    <div class="ghost-row" id="ghost-row">
      <span class="ghost-emoji" style="opacity: 1; transform: none;">👻</span>
    </div>
    <div class="loader-container"><div id="loader-fill"></div></div>
  </div>

  <div id="login-container">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white;">|Just•Abacha😎|</div>
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div style="margin-top:20px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <script>
    const ghostRow = document.getElementById('ghost-row');
    const loaderFill = document.getElementById('loader-fill');
    
    // Global flags to prevent the "Login Leak"
    window.isDatabaseReady = false;
    window.finalTarget = null;
    window.isLoaderFinished = false;

    // 1. GHOST TAP-TAP (Starting from the 2nd ghost)
    let ghostCount = 1;
    const maxGhosts = 6;
    const ghostInterval = setInterval(() => {
        if (ghostCount < maxGhosts) {
            const span = document.createElement('span');
            span.className = 'ghost-emoji';
            span.innerText = '👻';
            ghostRow.appendChild(span);
            ghostCount++;
        }
    }, 1100);

    // 2. LOADING BAR (Synchronized to hit 100% at 7s)
    let progress = 0;
    const totalTime = 7000;
    const progressInterval = setInterval(() => {
        progress += (100 / (totalTime / 100)); 
        if (progress >= 100) {
            loaderFill.style.width = '100%';
            clearInterval(progressInterval);
            window.isLoaderFinished = true;
            checkFinalTransition();
        } else {
            loaderFill.style.width = progress + '%';
        }
    }, 100);

    // 3. YOUR EXACT NESTED LOGIC (Restored & Fixed)
    setTimeout(async () => {
        const supabaseClient = window.supabase.createClient('https://zvkretqhqmxuhgspddpu.supabase.co', 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY');

        setTimeout(async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_approved')
                    .eq('id', session.user.id)
                    .single();

                if (profile && profile.is_approved) {
                    window.finalTarget = 'hub.html';
                } else {
                    await supabaseClient.auth.signOut();
                }
            }
            window.isDatabaseReady = true;
            checkFinalTransition();
        }, 5000); 
    }, 2000);

    function checkFinalTransition() {
        // ONLY move if the DB check is done AND the bar is visually full
        if (window.isDatabaseReady && window.isLoaderFinished) {
            if (window.finalTarget) {
                window.location.replace(window.finalTarget);
            } else {
                showLoginUI();
            }
        }
    }

    function showLoginUI() {
        clearInterval(ghostInterval);
        const splash = document.getElementById('splash-screen');
        const login = document.getElementById('login-container');
        if (splash) splash.style.opacity = '0';
        setTimeout(() => {
            if (splash) splash.remove();
            // 🚨 Restore the login box correctly for app.js
            login.style.display = 'block'; 
            setTimeout(() => { login.style.opacity = '1'; }, 50);
        }, 1000);
    }
  </script>
</body>
</html>
