<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just•Abacha😎</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 1. THE GHOST ROW & RHYTHM */
    .ghost-row {
      display: flex;
      gap: 12px;
      font-size: 2.2rem;
      margin-top: 25px;
      height: 50px;
    }
    
    .ghost-emoji {
      /* Pulse animation gives it that "loading dots" rhythm */
      animation: ghostPulse 1.5s infinite ease-in-out;
    }

    /* Staggered entry for the rhythmic "tap-tap" */
    .new-ghost {
      opacity: 0;
      transform: scale(0.5);
      animation: ghostEnter 0.4s forwards ease-out, ghostPulse 1.5s infinite ease-in-out;
    }

    @keyframes ghostEnter {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes ghostPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }

    /* 2. THE SLOW-FILL BAR */
    .loader-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 30px;
      overflow: hidden;
    }
    #loader-fill {
      width: 0%;
      height: 100%;
      background: #32D74B;
      box-shadow: 0 0 12px #32D74B;
      transition: width 0.15s linear;
    }
  </style>
</head>

<body class="login-page">
  <div id="splash-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
    <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 0;">Just•Abacha😎</h1>
    
    <div class="ghost-row" id="ghost-row">
      <span class="ghost-emoji">👻</span>
    </div>

    <div class="loader-container">
      <div id="loader-fill"></div>
    </div>
  </div>

  <div id="login-container" style="opacity:0; transition: opacity 1s ease;">
    <div style="position:absolute; top:20px; left:20px; font-weight:900; color:white;">|Just•Abacha😎|</div>
    <div style="text-align:center; padding-top:100px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div style="margin-top:20px;">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <script>
    const ghostRow = document.getElementById('ghost-row');
    const loaderFill = document.getElementById('loader-fill');
    
    // 1. RHYTHMIC GHOST GENERATOR
    let ghostCount = 1; // Starting at 1 because Lead Ghost is already there
    const maxGhosts = 6; 

    const ghostInterval = setInterval(() => {
        if (ghostCount < maxGhosts) {
            const span = document.createElement('span');
            span.className = 'new-ghost';
            span.innerText = '👻';
            // Stagger the pulse animation so they don't all move at the same time
            span.style.animationDelay = (ghostCount * 0.2) + 's';
            ghostRow.appendChild(span);
            ghostCount++;
        }
    }, 1000); // Rhythmic 1-second "tap"

    // 2. LOADING BAR (7 Seconds Total)
    let progress = 0;
    const totalTime = 7000; 
    const progressInterval = setInterval(() => {
        progress += (100 / (totalTime / 100)); 
        if (progress <= 100) {
            loaderFill.style.width = progress + '%';
        }
    }, 100);

    // 3. YOUR NESTED PROTOCOL
    setTimeout(async () => {
        const supabaseClient = window.supabase.createClient('https://zvkretqhqmxuhgspddpu.supabase.co', 'sb_publishable__7_K38aDluNYgS0bxLuLfA_aV5-ZnIY');

        setTimeout(async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('is_approved')
                    .eq('id', session.user.id)
                    .single();

                if (profile && profile.is_approved) {
                    window.location.replace('hub.html');
                } else {
                    await supabaseClient.auth.signOut();
                    showLoginUI();
                }
            } else {
                showLoginUI();
            }
        }, 5000); 

        function showLoginUI() {
            clearInterval(ghostInterval);
            clearInterval(progressInterval);
            const splash = document.getElementById('splash-screen');
            if (splash) splash.style.opacity = '0';
            setTimeout(() => {
                if (splash) splash.remove();
                const container = document.getElementById('login-container');
                if (container) container.style.opacity = '1';
            }, 1000);
        }
    }, 10000); 
  </script>
</body>
</html>
