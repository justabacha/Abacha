<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
    
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script src="theme-engine.js"></script>
</head>
<body class="chat-page">
    <div id="chat-overlay" class="message-overlay" onclick="this.style.display='none'">
        <div id="menu-content" style="display: flex; flex-direction: column; align-items: center; width: 100%;"></div>
    </div>

    <div id="delete-modal" class="ghost-modal-overlay">
        <div class="ghost-modal-tile">
            <div class="modal-header" style="text-align: left;">Just•Abacha😎</div>
            <p style="font-size: 15px; margin-bottom: 20px; text-align: left;">Do you want to delete this message?</p>
            <div class="modal-btns">
                <button class="modal-btn btn-yes" onclick="confirmGhostDelete()">Yes</button>
                <button class="modal-btn btn-no" onclick="closeGhostModal()">No</button>
            </div>
        </div>
    </div>

    <div id="pin-modal" class="ghost-modal-overlay">
        <div class="ghost-modal-tile">
            <div class="modal-header" style="text-align: left;">Just•Abacha😎</div>
            <p style="font-size: 15px; margin-bottom: 10px; text-align: left;">For how long do u wanna pin this.?</p>
            <div class="pin-options-list">
                <div class="pin-opt" onclick="executePin(12)">12 Hours</div>
                <div class="pin-opt" onclick="executePin(24)">24 Hours</div>
                <div class="pin-opt" onclick="executePin(168)">7 Days</div>
                <div class="pin-opt" onclick="executePin(720)">1 Month</div>
            </div>
            <button class="modal-btn btn-no" style="margin-top:15px; width:100%" onclick="document.getElementById('pin-modal').style.display='none'">Cancel</button>
        </div>
    </div>

 <div class="chat-header">
  <a href="chat-list.html" style="text-decoration:none; color:white; font-size:24px; margin-right:15px;">‹‹</a>
  <div class="chat-avatar" id="header-avatar" style="width:40px; height:40px; border-radius:50%; background-size: cover; margin-right:10px;"></div>
  
  <div style="display: flex; flex-direction: column;">
      <h4 class="chat-user-name" id="header-name" style="margin:0; color:white;">Ghost...</h4>
      <div id="typing-indicator" style="font-size: 8px; color: #32D74B; font-weight: bold; display: none; letter-spacing: 1px; animation: pulse 1.5s infinite;">
          TYPING...
      </div>
  </div>
  
  <span id="online-status" style="margin-left: auto; color: #6c6b6b; font-size: 10px; font-weight: bold; letter-spacing: 1px;">● OFFLINE</span>
</div>

    <div id="pinned-bar"></div>

    <div id="chat-box"></div>

        <div class="floating-input-container">
           <div id="vibe-action-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; width: 100%; box-sizing: border-box; padding: 0 5px;">
                 
                <div class="vibe-circle" onclick="triggerMusicUpload()"><img src="https://img.icons8.com/fluency/48/apple-music.png" width="24"></div>
                <div class="vibe-circle" onclick="triggerPhotoUpload()"><img src="https://img.icons8.com/color/48/google-photos-new.png" width="24"></div>
                <div class="vibe-circle" onclick="shareLocation()"><img src="https://img.icons8.com/fluency/48/google-maps-new.png" width="24"></div>
                <div class="vibe-circle" onclick="window.showGhostPrompt('Voice notes coming soon! 🎙️🍻')"><img src="https://img.icons8.com/fluency/48/microphone.png" width="24"></div>
            </div>


            <div id="reply-preview-container"></div>
        <div class="input-tile" style="align-items: flex-end; display: flex; padding: 10px 15px;">
    <div onclick="toggleEmojiLayer()" style="width: 38px; height: 38px; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; margin-right: 12px; flex-shrink: 0; font-size: 20px;">🎭</div>
    
    <textarea id="msg-input" placeholder="Rada?..." rows="1" autocomplete="off" style="flex: 1; min-height: 38px; max-height: 150px; padding: 8px 0;"></textarea>
    
    <button id="send-btn" style="margin-left: 10px; height: 38px; font-size: 22px;">🚀</button>
</div>
        </div>
    <div id="ghost-prompt-overlay"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="notifications.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>

<script src="ui-extras.js"></script>
   <div id="ghost-emoji-layer" class="glass-tray" style="display: none;">
    <div class="tray-header">
        <span onclick="toggleEmojiLayer()" style="cursor:pointer; font-size: 18px;">←</span>
        <span>Ghost Emojis</span>
        <span onclick="emojiBackspace()" style="cursor:pointer; color:#f4eeee; font-size: 18px;">⌫</span>
    </div>
    <div class="emoji-grid" id="dynamic-emoji-grid"></div>
</div>
</body>
    </html>
